name: arshievent_scan
description: Application mobile de scan pour ARSHIEVENT
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # Scan QR code
  mobile_scanner: ^3.5.0
  
  # Graphiques
  fl_chart: ^0.66.0
  
  # Gestion d'état
  provider: ^6.1.0
  
  # Réseau
  http: ^1.1.0
  
  # Stockage local
  shared_preferences: ^2.2.2
  
  # Utilitaires
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true